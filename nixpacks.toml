# --- Install Dependencies ---
[phases.setup]
aptPkgs = ["nodejs", "npm"]

[phases.install]
cmds = [
  "cd backend && npm install",
  "cd backend/frontend && npm install"
]

# --- Build Frontend ---
[phases.build]
cmds = [
  "cd backend/frontend && npm run build"
]

# --- Move Dist Into Backend (Railway needs this) ---
[phases.buildDist]
cmds = [
  "mv backend/frontend/dist backend/frontend-dist"
]

# --- Start Server ---
[start]
cmd = "cd backend && PORT=$PORT node dist/index.js"
