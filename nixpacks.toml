# --- Install Dependencies ---
[phases.setup]
aptPkgs = ["nodejs-18_x", "npm"]

[phases.install]
cmds = [
  "cd backend && npm ci --include=dev"
]

# --- Build Backend Only (API-only, no frontend) ---
[phases.build]
cmds = [
  "cd backend && npm run build"
]

# --- Start Server ---
[start]
cmd = "cd backend && PORT=$PORT node dist/index.js"
